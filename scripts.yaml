################################################################################
# Whole house. These MIoT actions take no parameters, so they are plain button
# presses. The same reset guard applies: a paused job would otherwise resume.
################################################################################

vacuum_whole_house:
  alias: "Aspirar a Casa Toda"
  icon: mdi:robot-vacuum
  mode: single
  sequence:
    - if:
        - condition: not
          conditions:
            - condition: state
              entity_id: vacuum.xiaomi_xx_000000000_ov42gl
              state: "docked"
      then:
        - action: button.press
          target:
            entity_id: button.xiaomi_xx_000000000_ov42gl_stop_working_a_2_51
        - delay:
            seconds: 4
    - action: select.select_option
      target:
        entity_id: select.xiaomi_xx_000000000_ov42gl_sweep_mop_type_p_2_4
      data:
        option: "Vacuuming"
    - action: select.select_option
      target:
        entity_id: select.xiaomi_xx_000000000_ov42gl_mode_p_2_9
      data:
        option: "Standard"
    - action: button.press
      target:
        entity_id: button.xiaomi_xx_000000000_ov42gl_start_only_sweep_a_2_4

mop_whole_house:
  alias: "Passar Pano na Casa Toda"
  icon: mdi:bucket-outline
  mode: single
  sequence:
    - if:
        - condition: not
          conditions:
            - condition: state
              entity_id: vacuum.xiaomi_xx_000000000_ov42gl
              state: "docked"
      then:
        - action: button.press
          target:
            entity_id: button.xiaomi_xx_000000000_ov42gl_stop_working_a_2_51
        - delay:
            seconds: 4
    - action: select.select_option
      target:
        entity_id: select.xiaomi_xx_000000000_ov42gl_mop_water_output_level_p_2_10
      data:
        option: "Level 2"
    - action: button.press
      target:
        entity_id: button.xiaomi_xx_000000000_ov42gl_start_mop_a_2_5

clean_whole_house:
  alias: "Limpar a Casa Toda"
  icon: mdi:home-heart
  mode: single
  sequence:
    - if:
        - condition: not
          conditions:
            - condition: state
              entity_id: vacuum.xiaomi_xx_000000000_ov42gl
              state: "docked"
      then:
        - action: button.press
          target:
            entity_id: button.xiaomi_xx_000000000_ov42gl_stop_working_a_2_51
        - delay:
            seconds: 4
    - action: button.press
      target:
        entity_id: button.xiaomi_xx_000000000_ov42gl_start_sweep_mop_a_2_6

robot_go_home:
  alias: "Robô para a Base"
  icon: mdi:home-import-outline
  mode: single
  sequence:
    - action: vacuum.return_to_base
      target:
        entity_id: vacuum.xiaomi_xx_000000000_ov42gl
